version: "3.8"

services:
  face-detection:
    build:
      context: .
      dockerfile: Dockerfile
    image: household-face-detection:latest
    container_name: face-detection-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # In Unraid: /mnt/user/appdata/facedetection:/config
      # In standard Docker: ./data:/config
      - ./data:/config
    environment:
      # Unraid User/Group Permissions
      - PUID=99
      - PGID=100
      - UMASK=002
      - CONFIG_DIR=/config
      
      # Model & Face Engine Settings
      - FACE_MODEL_NAME=buffalo_l        # 'buffalo_l' (high accuracy) or 'buffalo_s' (ultra-fast)
      - SIMILARITY_THRESHOLD=0.45       # Matching threshold (0.40 - 0.55 recommended)
      - DETECTION_CONFIDENCE=0.50       # Minimum face detection confidence
      - MAX_SAMPLES_PER_PERSON=50       # Maximum face samples per entity

      # High-Performance Inference & Latency Settings
      - ORT_NUM_THREADS=8               # Prevents 98-core thread thrashing (4-8 recommended for CPU)
      - DET_SIZE=320                    # 320 for ultra-fast (~20-50ms), 480 for balanced, 640 for max range
      - MAX_IMAGE_SIZE=1280             # Downscale 4K/2K frames to 1280px max dimension
      
      # Authentication & Security
      - DEFAULT_ADMIN_USER=admin
      - DEFAULT_ADMIN_PASSWORD=admin123 # Change upon first deployment
      # - WEBHOOK_SECRET=your_custom_secret_key # Optional token check

      # Real-Time RTSP Stream Ingestion
      - RTSP_ENABLED=false              # Set to true to automatically start RTSP stream on boot
      - RTSP_URL=                       # e.g. rtsp://user:pass@192.168.1.10:7447/stream
      - RTSP_CAMERA_NAME=Front Door RTSP
      - RTSP_FPS=3.0                    # Processing rate: 2-5 FPS recommended
      - RTSP_COOLDOWN_SECONDS=30        # Alert cooldown per entity to prevent spam
      - RTSP_WEBHOOK_URL=               # e.g. http://192.168.1.20:8123/api/webhook/face_detected

      # MQTT Broker Event Publishing
      - MQTT_ENABLED=false              # Set to true to publish detection events to MQTT
      - MQTT_HOST=                      # e.g. 192.168.1.50
      - MQTT_PORT=1883
      - MQTT_USER=
      - MQTT_PASSWORD=
      - MQTT_TOPIC=facedetection/events
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
